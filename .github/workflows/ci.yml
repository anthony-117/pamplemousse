name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Pamplemousse.slnx

      # Formatting and .editorconfig style rules (like `cargo fmt --check`).
      - name: Check formatting
        run: dotnet format Pamplemousse.slnx --verify-no-changes --no-restore

      # Roslynator, Meziantou and .NET analyzers run in the build; any finding is an error (like `cargo clippy -D warnings`).
      - name: Build and lint
        run: dotnet build Pamplemousse.slnx -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test Pamplemousse.slnx -c Release --no-build
          --settings coverage.runsettings --collect "XPlat Code Coverage"
          --results-directory coverage --logger trx

      - name: Coverage summary (fails below 85%)
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          format: markdown
          output: both
          thresholds: "85 95"
          fail_below_min: true

      - name: Publish coverage to the job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Docker image builds
        run: docker build -t pamplemousse:ci .
